[package]
name = "vandelay"
description = "JMAP account migration utility"
version = "1.0.10"
authors = ["Stalwart Labs LLC <hello@stalw.art>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/stalwartlabs/vandelay"
homepage = "https://github.com/stalwartlabs/vandelay"
edition = "2024"
readme = "README.md"

[package.metadata.wix]
upgrade-guid = "5C8148E7-34A9-4216-A802-FFB8345AECC4"
path-guid = "FA9E97EB-5E5C-4809-9018-9DC1EDB0E93D"
license = false
eula = false

[[bin]]
name = "vandelay"
path = "src/main.rs"

[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["rusqlite/bundled"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2.14.0", features = ["serde"] }
rusqlite = { version = "0.40", features = ["blob"] }
blake3 = "1.8.5"
time = { version = "0.3.47", features = ["serde-well-known", "macros"] }
url= "2.5.8"
thiserror  = "2.0.18"
ureq = { version = "3.3.0", default-features = false, features = ["json", "gzip", "rustls-no-provider", "platform-verifier"] }
clap = { version = "4.6.1", features = ["derive"] }
crossbeam-channel = "0.5.15"
num_cpus = "1.17.0"
base64 = "0.23"
mail-parser = "0.11.3"
calcard = "0.3"
rustls = { version = "0.23.40", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
regex  = "1.13"
flate2 = "1.1.9"
quick-xml = "0.41"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", default-features = false }
psl = "2.1.226"

[dev-dependencies]
mockito = "1.7.2"
tempfile = "3.13"
testcontainers = { version = "0.28", features = ["blocking"] }

[profile.dist]
inherits = "release"
lto = "thin"
